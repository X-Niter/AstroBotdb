<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Planet with rings -->
  <circle cx="32" cy="32" r="16" fill="url(#planetGradient)"/>
  
  <!-- Planet rings -->
  <ellipse cx="32" cy="32" rx="28" ry="10" transform="rotate(-15 32 32)" stroke="url(#ringGradient)" stroke-width="1.5" fill="none"/>
  <ellipse cx="32" cy="32" rx="24" ry="8" transform="rotate(-15 32 32)" stroke="url(#ringGradient)" stroke-width="1" fill="none"/>
  
  <!-- Stars -->
  <circle cx="12" cy="14" r="1.5" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="18" r="1" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="48" r="1.2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="50" r="0.8" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Small glowing spots on the planet -->
  <circle cx="38" cy="28" r="2" fill="url(#glowGradient1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="26" cy="36" r="3" fill="url(#glowGradient2)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gradients -->
  <defs>
    <radialGradient id="planetGradient" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </radialGradient>
    
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    
    <radialGradient id="glowGradient1" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glowGradient2" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>