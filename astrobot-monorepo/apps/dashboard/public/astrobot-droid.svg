<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="500" viewBox="0 0 300 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot silhouette -->
  <rect x="100" y="100" width="100" height="150" rx="20" fill="#EFEFEF" />
  
  <!-- Head -->
  <circle cx="150" cy="70" r="40" fill="#F5F5F5" />
  
  <!-- Eyes -->
  <circle cx="130" cy="60" r="10" fill="#00CCFF" />
  <circle cx="170" cy="60" r="10" fill="#00CCFF" />
  
  <!-- Body details -->
  <rect x="120" y="130" width="60" height="80" rx="5" fill="#333333" />
  
  <!-- Glowing elements -->
  <circle cx="150" cy="170" r="15" fill="#00CCFF" opacity="0.8" />
  <circle cx="150" cy="170" r="20" fill="#00CCFF" opacity="0.3" />
  
  <!-- Arms -->
  <rect x="50" y="130" width="50" height="15" rx="5" fill="#E0E0E0" />
  <rect x="200" y="130" width="50" height="15" rx="5" fill="#E0E0E0" />
  
  <!-- Legs -->
  <rect x="120" y="250" width="20" height="80" rx="5" fill="#E0E0E0" />
  <rect x="160" y="250" width="20" height="80" rx="5" fill="#E0E0E0" />
  
  <!-- Feet -->
  <rect x="110" y="330" width="35" height="15" rx="5" fill="#333333" />
  <rect x="155" y="330" width="35" height="15" rx="5" fill="#333333" />
  
  <!-- Glow effect -->
  <circle cx="150" cy="170" r="70" fill="#00CCFF" opacity="0.1" />
  
  <!-- Text label placeholder -->
  <text x="150" y="380" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">AstroBot</text>
</svg>