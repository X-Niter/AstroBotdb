{% extends 'modern_base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container max-w-4xl mx-auto px-4 py-12">
    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-8 text-center">
        <div class="flex flex-col items-center justify-center space-y-6">
            <div class="h-32 w-32 bg-indigo-100 dark:bg-indigo-900 rounded-full flex items-center justify-center">
                <span class="text-6xl text-indigo-600 dark:text-indigo-300">404</span>
            </div>
            
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Page Not Found</h1>
            
            <p class="text-lg text-gray-600 dark:text-gray-300 max-w-md">
                The page you're looking for doesn't exist or has been moved.
            </p>
            
            <div class="space-y-4 mt-4">
                <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition duration-200">
                    Return to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
